<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetMatch Playground — Dog & Cat Toy Time</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="playground-wrapper">
        <!-- Header Controls -->
        <header class="header">
            <div class="brand">
                <span class="logo-icon">🐾</span>
                <div>
                    <h1>PetMatch Playground</h1>
                    <p>Interactive Dog & Cat Toy Playground</p>
                </div>
            </div>
            <div class="header-actions">
                <button id="soundToggleBtn" class="icon-btn" title="Toggle Sound">
                    <span id="soundIcon">🔊</span> Sound On
                </button>
                <button id="clearBtn" class="secondary-btn">Clear Playground</button>
            </div>
        </header>

        <!-- Pet Joy Meters -->
        <div class="stats-bar">
            <div class="pet-stat dog-stat">
                <div class="stat-header">
                    <span class="pet-avatar">🐶</span>
                    <div>
                        <strong class="pet-name">Buddy the Dog</strong>
                        <span class="pet-status" id="dogStatus">Feeling curious...</span>
                    </div>
                </div>
                <div class="meter-bg">
                    <div class="meter-fill dog-fill" id="dogJoyFill" style="width: 30%;"></div>
                </div>
                <span class="joy-text" id="dogJoyText">Joy: 30%</span>
            </div>

            <div class="pet-stat cat-stat">
                <div class="stat-header">
                    <span class="pet-avatar">🐱</span>
                    <div>
                        <strong class="pet-name">Milo the Cat</strong>
                        <span class="pet-status" id="catStatus">Watching closely...</span>
                    </div>
                </div>
                <div class="meter-bg">
                    <div class="meter-fill cat-fill" id="catJoyFill" style="width: 30%;"></div>
                </div>
                <span class="joy-text" id="catJoyText">Joy: 30%</span>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-container">
            <canvas id="gameCanvas"></canvas>
            <div class="canvas-overlay-hint" id="canvasHint">
                ✨ Click or tap anywhere in the park to drop a toy!
            </div>
        </div>

        <!-- Toybox & Action Toolbar -->
        <div class="toolbar">
            <div class="toybox-title">
                <span>🎒 Select a Toy to Toss:</span>
            </div>
            <div class="toy-grid">
                <button class="toy-btn active" data-toy="ball">
                    <span class="toy-emoji">🎾</span>
                    <span class="toy-label">Tennis Ball</span>
                </button>
                <button class="toy-btn" data-toy="bone">
                    <span class="toy-emoji">🦴</span>
                    <span class="toy-label">Squeaky Bone</span>
                </button>
                <button class="toy-btn" data-toy="duck">
                    <span class="toy-emoji">🦆</span>
                    <span class="toy-label">Rubber Duck</span>
                </button>
                <button class="toy-btn" data-toy="yarn">
                    <span class="toy-emoji">🧶</span>
                    <span class="toy-label">Yarn Ball</span>
                </button>
                <button class="toy-btn" data-toy="feather">
                    <span class="toy-emoji">🪶</span>
                    <span class="toy-label">Feather Wand</span>
                </button>
                <button class="toy-btn" data-toy="mouse">
                    <span class="toy-emoji">🐭</span>
                    <span class="toy-label">Toy Mouse</span>
                </button>
            </div>

            <div class="extra-actions">
                <button id="treatBtn" class="treat-btn">
                    <span>🦴 Toss Treat Bag 🥩</span>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
